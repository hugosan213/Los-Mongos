<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insertar Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .card { max-width: 720px; margin: 40px auto; }
  </style>
</head>
<body>
  <div class="card shadow">
    <div class="card-body">
      <h3 class="card-title">Insertar Cliente</h3>
      <p class="text-muted">Completa los datos y presiona Guardar.</p>

      <form id="formCliente">
        <div id="camposDinamicos"></div>
        <div class="mb-3">
          <label class="form-label">Servicio contratado (opcional)</label>
          <select id="selectServicio" name="servicio_id" class="form-select">
            <option value="">-- Seleccione (opcional) --</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Guardar</button>
          <button class="btn btn-secondary" type="button" id="btnLimpiar">Limpiar</button>
        </div>
      </form>

      <div id="alertPlaceholder" class="mt-3"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('formCliente');
    const alertPlaceholder = document.getElementById('alertPlaceholder');
    const btnLimpiar = document.getElementById('btnLimpiar');

    function showAlert(message, type='success') {
      alertPlaceholder.innerHTML = `<div class="alert alert-${type}" role="alert">${message}</div>`;
    }

    // Construir formulario dinámicamente según esquema
    async function construirFormulario() {
      try {
        const res = await fetch('http://127.0.0.1:3000/api/cliente/schema');
        if (!res.ok) throw new Error('No se pudo obtener esquema');
        const cols = await res.json();
        const cont = document.getElementById('camposDinamicos');
        cont.innerHTML = '';

        // Crear campos en el orden devuelto por DESCRIBE
        cols.forEach(col => {
          // Omitir columnas auto_increment
          if (/auto_increment/i.test(col.Extra)) return;

          const field = col.Field;
          // Ignorar campo fecha_baja (o variantes) porque no es útil en el formulario de inserción
          // Soportar variantes como 'fecha_baja', 'fechaBaja', 'fechabaja', 'fecha baja', etc.
          const fldLower = (field || '').toLowerCase();
          const fldNormalized = fldLower.replace(/[_\s-]/g, '');
          if (fldNormalized === 'fechabaja' || (fldLower.includes('fecha') && fldLower.includes('baja'))) return;

          const isRequired = (col.Null === 'NO' && (col.Default === null || typeof col.Default === 'undefined')) && !/auto_increment/i.test(col.Extra);

          // Mapear tipo de input
          let inputType = 'text';
          const t = (col.Type || '').toLowerCase();
          if (field.toLowerCase().includes('correo') || field.toLowerCase().includes('email')) inputType = 'email';
          else if (field.toLowerCase().includes('contras') || field.toLowerCase().includes('password')) inputType = 'password';
          else if (t.includes('int') || t.includes('decimal') || t.includes('float')) inputType = 'number';
          else if (t.includes('date') || t.includes('time')) inputType = 'date';

          const formGroup = document.createElement('div');
          formGroup.className = 'mb-3';
          const label = document.createElement('label');
          label.className = 'form-label';
          label.textContent = field + (isRequired ? ' *' : '');
          const input = document.createElement('input');
          input.className = 'form-control';
          input.name = field;
          input.type = inputType;
          if (isRequired) input.required = true;

          formGroup.appendChild(label);
          formGroup.appendChild(input);
          cont.appendChild(formGroup);
        });

      } catch (err) {
        console.error('No fue posible construir formulario dinámico:', err);
        // Fallback: mostrar mensaje y mantener formulario vacío
        const cont = document.getElementById('camposDinamicos');
        cont.innerHTML = '<div class="alert alert-warning">No se pudo cargar el formulario dinámico. Rellene manualmente los campos necesarios.</div>';
      }
    }

    // Construir al cargar
    document.addEventListener('DOMContentLoaded', construirFormulario);

    // Cargar lista de servicios para el select
    async function cargarServicios() {
      try {
        const res = await fetch('http://127.0.0.1:3000/api/servicio');
        if (!res.ok) throw new Error('No se pudieron cargar servicios');
        const servicios = await res.json();
        const sel = document.getElementById('selectServicio');
        servicios.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.idServicio || s.id || s.idservicio || s.idServicio;
          opt.textContent = (s.nombre || s.nombre_servicio || s.nombreServicio || ('Servicio ' + opt.value)) + (s.precio ? ` — $${s.precio}` : '');
          sel.appendChild(opt);
        });
      } catch (err) {
        console.warn('No se pudieron cargar servicios:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', cargarServicios);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await fetch('http://127.0.0.1:3000/api/cliente', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const body = await res.json();
        if (res.ok) {
          showAlert('✅ Cliente registrado con ID: ' + (body.insertId || body.id) , 'success');
          form.reset();
        } else {
          showAlert('❌ Error al registrar cliente: ' + (body.error || JSON.stringify(body)), 'danger');
        }
      } catch (err) {
        showAlert('❌ Error de red: ' + err.message, 'danger');
      }
    });

    btnLimpiar.addEventListener('click', () => form.reset());
  </script>
</body>
</html>


<section class="planilla-contacto">

  <div class="formato-formulario">
      <!-- Formulario -->
    <div class="formulario">
      <div class="Titulo-contacto">
          <p>Estamos listos para ayudarte. Completa el formulario o elige una de nuestras vías de contacto.</p>
      </div>
        <form action="https://formspree.io/f/mrbaandq" method="POST">
            <input type="text" name="nombre" class="form-control mb-3" placeholder="Nombre completo" required>
            <input type="email" name="email" class="form-control mb-3" placeholder="Correo electrónico" required>
            <input type="text" name="asunto" class="form-control mb-3" placeholder="Asunto" required>
            <textarea class="form-control mb-3" name="mensaje" rows="10" placeholder="Mensaje" required></textarea>
        </form>
        <!-- Mensaje de feedback -->
        <p id="form-status" style="margin-top:10px; font-weight:bold;"></p>
    </div>
    <!-- Información de contacto -->
    <div class="info-contacto">
      <h2>Información de contacto</h2>
      <p>Teléfono: <strong>+54 9 1234 5678</strong></p>
      <p>Email: <strong>contacto@versum.com</strong></p>
      
      <div class="links-contacto">
        <a href="https://wa.me/5412345678" target="_blank" class="btn-whatsapp">
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp"> Enviar WhatsApp
        </a>
        <button type="submit" class="contacto-contact-btn">Enviar Mensaje</button>
      </div>
    </div>
  </div>
</section>
